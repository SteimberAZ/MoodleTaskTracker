# Checks every pull request and every push to main: the Python worker and the Next.js web app.
# The Python job runs with CI=true (set by GitHub), so tests/conftest.py fails the run if the
# Web Push tests cannot import their libraries or get skipped.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Worker (Python)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-worker.txt
            requirements-dev.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-worker.txt -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q -rs

  web:
    name: Web (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    env:
      # Dummy values: the build only needs them to be present. No real secret belongs here.
      SUPABASE_URL: https://example.com
      SUPABASE_ANON_KEY: x
      MOODLE_DB_JWT: x
      ADMIN_MOODLE_USERNAME: x
      SESSION_SECRET: 0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: BEl62iUYgUivxIkv69yViEuiBIa-Ib9-SkvMeAtA3LFgDzkrxZJjSgSnfckjBJuBkr3qBUYIHBQFLXYp5Nksh8U
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
